<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>compount interest calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
    <h2>Compound Interest Calculator</h2>

    <div class="field">
        <label>Principal (P):</label>
        <span>40000</span>
    </div>

    <div class="field">
        <label>Rate of Interest (r):</label>
        <span>0.05</span>
    </div>

    <div class="field">
        <label>Compounding Frequency (n):</label>
        <span>1</span>
    </div>

    <div class="field">
        <label>Time (t):</label>
        <span>3 years</span>
    </div>
</div>
    <script type="module" src="script.js"></script>
</body>
</html>
